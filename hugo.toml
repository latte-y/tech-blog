# 本番のURLはデプロイ時に `hugo --baseURL https://xxxx.cloudfront.net/` で上書きする
baseURL = '/'
locale = 'ja-jp'
defaultContentLanguage = 'ja'
title = 'Tech Blog'
# 記事の最終更新日を git の履歴から取る（CI では fetch-depth: 0 が必要）
enableGitInfo = true

[module]
  [[module.imports]]
    path = 'github.com/imfing/hextra'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[[menu.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 1

[[menu.main]]
  name = "Search"
  weight = 2
  [menu.main.params]
    type = "search"

[[menu.main]]
  name = "GitHub"
  url = "https://github.com/latte-y/tech-blog"
  weight = 3
  [menu.main.params]
    icon = "github"

[params]
  displayUpdatedDate = true
  dateFormat = '2006-01-02'

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.theme]
    default = "system"
    displayToggle = true

  [params.footer]
    displayCopyright = false
    displayPoweredBy = true
